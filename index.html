<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petition: Unmute CookieWT on adwfss</title>
    <!-- Librairie JS pour l'effet de confettis -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #2f3136; /* Discord dark background */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .sign-container {
            border: 6px dashed #7289da; /* Discord blurple border */
            padding: 40px 50px;
            text-align: center;
            border-radius: 20px;
            background-color: #36393f;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 550px;
            width: 90%;
        }
        .cookie-icon {
            font-size: 5rem;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #f0b232; /* Cookie gold color */
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 1.1rem;
            color: #dcddde;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .server-tag {
            color: #7289da;
            font-weight: bold;
        }
        
        /* Petition Progress Box */
        .petition-box {
            background-color: #2f3136;
            padding: 20px;
            border-radius: 12px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            margin-bottom: 25px;
        }
        .counter {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .progress-bar-bg {
            background-color: #202225;
            border-radius: 10px;
            height: 22px;
            width: 100%;
            overflow: hidden;
            margin: 15px 0;
            border: 1px solid #4f545c;
        }
        .progress-bar-fill {
            background-color: #43b581; /* Discord green */
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-in-out;
        }
        .sign-btn {
            background-color: #7289da;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 100%;
        }
        .sign-btn:hover {
            background-color: #5b6eae;
            transform: translateY(-2px);
        }
        .sign-btn:disabled {
            background-color: #4f545c;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Community Links Buttons */
        .social-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            transition: transform 0.2s, opacity 0.2s;
            flex: 1 1 30%;
            min-width: 120px;
        }
        .social-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .discord-btn {
            background-color: #5865F2;
        }
        .yt-btn {
            background-color: #FF0000;
        }
        .tiktok-btn {
            background-color: #000000;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="sign-container">
        <div class="cookie-icon">🍪</div>
        <h1>Official Petition</h1>
        <p>Sign to unmute <strong>CookieWT</strong> in the <span class="server-tag">adwfss</span> server!</p>

        <div class="petition-box">
            <div class="counter" id="counter-text">0 / 1000 Signatures</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
            <button class="sign-btn" id="sign-btn">Sign Petition</button>
        </div>

        <!-- Liens Communautaires Officiels -->
        <div class="social-links">
            <a href="https://discord.gg/e9XtZQMTCv" target="_blank" class="social-btn discord-btn">
                👾 Discord
            </a>
            <a href="https://youtube.com/@cookiewt" target="_blank" class="social-btn yt-btn">
                🎬 YouTube
            </a>
            <a href="https://www.tiktok.com/@c0okie_wt" target="_blank" class="social-btn tiktok-btn">
                📱 TikTok
            </a>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZVuPgtlDXOWA1-LZQhfp2NQnstLiW2LE",
            authDomain: "cookiewt-petition.firebaseapp.com",
            databaseURL: "https://cookiewt-petition-default-rtdb.firebaseio.com",
            projectId: "cookiewt-petition",
            storageBucket: "cookiewt-petition.firebasestorage.app",
            messagingSenderId: "601347627545",
            appId: "1:601347627545:web:4589b9744081b67029e888",
            measurementId: "G-QMQ21TPWCY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const signaturesRef = ref(db, 'signatures');
        const goal = 1000;

        const counterText = document.getElementById('counter-text');
        const progressBar = document.getElementById('progress-bar');
        const signBtn = document.getElementById('sign-btn');

        if (localStorage.getItem('hasSigned') === 'true') {
            signBtn.innerText = "Petition Signed!";
            signBtn.disabled = true;
        }

        onValue(signaturesRef, (snapshot) => {
            const count = snapshot.exists() ? snapshot.size : 0;
            counterText.innerText = `${count} / ${goal} Signatures`;
            
            let percentage = (count / goal) * 100;
            if (percentage > 100) percentage = 100;
            progressBar.style.width = percentage + '%';
        });

        window.signPetition = function() {
            if (localStorage.getItem('hasSigned') === 'true') return;

            push(signaturesRef, {
                timestamp: Date.now()
            }).then(() => {
                localStorage.setItem('hasSigned', 'true');
                signBtn.innerText = "Petition Signed!";
                signBtn.disabled = true;

                // Lancement de l'animation de confettis
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }).catch((error) => {
                console.error("Erreur :", error);
            });
        };

        signBtn.addEventListener('click', window.signPetition);
    </script>

</body>
</html>
